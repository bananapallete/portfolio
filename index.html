<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unlimit_Cho — Portfolio</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="brand">
      <span class="brand-name" id="brandName"></span>
      <span class="brand-role" id="brandRole"></span>
    </div>
    <div class="lang-switch" id="langSwitch">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn active" data-lang="kr">KR</button>
    </div>
  </div>
</header>

<section class="work">
  <div class="container">
    <p class="site-bio" id="siteBio" hidden></p>
  </div>
  <div class="acc-list-wrap">
    <div class="acc-list" id="workSections"></div>
    <div class="page-skeleton" id="workSkeleton" aria-hidden="true">
      <div class="skeleton-box skeleton-row"></div>
      <div class="skeleton-box skeleton-row"></div>
      <div class="skeleton-box skeleton-row"></div>
      <div class="skeleton-box skeleton-row"></div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <div class="footer-title" id="footerName"></div>
      <div class="footer-contact" id="footerContact"></div>
    </div>
  </div>
</footer>

<script src="lenis.min.js"></script>
<script src="lenis-init.js"></script>
<script src="blocks.js"></script>
<script src="script.js"></script>
</body>
</html>
