<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 페이지 — Unlimit_Cho Portfolio</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="theme-dark admin-body">

<!-- 관리자 전용 유틸 바 — 이 바를 빼면 아래는 실제 사이트와 같은 구조 -->
<div class="admin-utilbar">
  <div class="container">
    <span class="autosave-status" id="autosaveStatus">불러오는 중...</span>
    <div class="admin-actions">
      <button class="btn btn-outline file-btn btn-small" title="data.json 파일을 직접 불러오기">
        불러오기(json)
        <input type="file" id="importFile" accept="application/json" />
      </button>
      <button class="btn btn-ghost btn-small" id="resetBtn" title="임시 저장을 지우고 원본 data.json을 다시 불러오기">원본 다시 불러오기</button>
      <button class="btn btn-ghost btn-small" id="previewBtn" title="지금 상태를 새 탭에서 미리보기">미리보기</button>
      <button class="btn btn-ghost btn-small" id="tokenBtn" title="배포에 쓸 GitHub 토큰 입력">GitHub 토큰 설정</button>
      <button class="btn btn-outline btn-small" id="exportBtn" title="data.json을 파일로 받아두는 백업">내보내기(백업)</button>
      <button class="btn btn-primary btn-small" id="publishBtn" title="지금 상태 전체를 GitHub에 커밋해 실제 사이트에 반영">🚀 사이트에 반영</button>
    </div>
  </div>
</div>

<!-- 임시저장 초안이 실제 사이트 내용과 다를 때만 나타나는 경고 -->
<div class="admin-stale" id="staleBanner" hidden>
  <div class="container">
    <span class="admin-stale-msg" id="staleMsg"></span>
    <div class="admin-stale-actions">
      <button class="btn btn-outline btn-small" id="staleUseServer" title="임시저장을 지우고 지금 사이트에 올라가 있는 내용을 가져옵니다">사이트에 올라간 내용 불러오기</button>
      <button class="btn btn-ghost btn-small" id="staleKeepDraft" title="화면에 올라와 있는 임시저장 내용을 그대로 두고 계속 편집합니다">임시저장 내용으로 계속 편집</button>
    </div>
  </div>
</div>

<!-- 실제 사이트(index.html)와 동일한 헤더: 브랜드 + 카테고리 탭 -->
<header class="site-header">
  <div class="container">
    <div class="brand">
      <span class="brand-name" id="brandName">Unlimit_Cho</span>
      <span class="brand-role" id="brandRole"></span>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<!-- 실제 사이트와 동일한 카테고리별 섹션 그리드 (카드를 클릭하면 편집 팝업) -->
<section class="work">
  <div id="workSections">
    <div class="empty-state">Loading...</div>
  </div>
</section>

<!-- 실제 사이트와 동일한 푸터 + 프로필 편집 버튼 -->
<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <div class="footer-title" id="footerName">Unlimit_Cho</div>
      <div class="footer-contact" id="footerContact"></div>
    </div>
    <button class="btn btn-outline btn-small" id="profileEditBtn">✎ 프로필 편집</button>
  </div>
</footer>

<div class="admin-modal-overlay hidden" id="projectEditOverlay">
  <div class="admin-modal">
    <div class="admin-modal-topbar">
      <span class="admin-modal-savestate" id="modalSaveState"></span>
      <button class="btn btn-primary btn-small" id="projectEditSave">🚀 저장 · 사이트에 반영</button>
      <button class="admin-modal-close" id="projectEditClose" title="저장하지 않고 닫기">✕</button>
    </div>
    <div id="projectEditBody"></div>
  </div>
</div>

<!-- 지금 어느 부분을 수정 중인지 보여주는 안내 칩 (입력창에 포커스하면 나타남) -->
<div class="editing-indicator" id="editingIndicator" aria-live="polite"></div>

<script src="blocks.js"></script>
<script src="admin.js"></script>
</body>
</html>
